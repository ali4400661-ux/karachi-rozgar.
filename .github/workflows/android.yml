name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create and Build Fast APK
        run: |
          # Download Android Command Line Tools directly
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mkdir -p android-sdk/cmdline-tools
          mv cmdline-tools android-sdk/cmdline-tools/latest
          rm tools.zip

          export ANDROID_HOME=$PWD/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2

          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

          # Setup minimal app source
          mkdir -p app/src/main/java/com/karachirozgar/app
          mkdir -p app/src/main/assets

          # Copy files to assets safely
          cp -r Karachihub/* app/src/main/assets/ 2>/dev/null || cp *.html app/src/main/assets/ 2>/dev/null || true

          # Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.karachirozgar.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Karachi Rozgar" android:theme="@android:style/Theme.NoTitleBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity
          cat << 'EOF' > app/src/main/java/com/karachirozgar/app/MainActivity.java
          package com.karachirozgar.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView wv = new WebView(this);
                  WebSettings ws = wv.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  wv.setWebViewClient(new WebViewClient());
                  wv.loadUrl("file:///android_asset/index.html");
                  setContentView(wv);
              }
          }
          EOF

          mkdir -p bin
          javac -source 1.8 -target 1.8 -bootclasspath $ANDROID_HOME/platforms/android-33/android.jar app/src/main/java/com/karachirozgar/app/MainActivity.java -d bin/
          d8 --output bin/ bin/com/karachirozgar/app/MainActivity.class --lib $ANDROID_HOME/platforms/android-33/android.jar
          aapt package -f -M app/src/main/AndroidManifest.xml -A app/src/main/assets -I $ANDROID_HOME/platforms/android-33/android.jar -F app-unsigned.apk
          cd bin && aapt add ../app-unsigned.apk classes.dex && cd ..
          zipalign -f 4 app-unsigned.apk Karachi-Rozgar.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Karachi-Rozgar-APK
          path: Karachi-Rozgar.apk
