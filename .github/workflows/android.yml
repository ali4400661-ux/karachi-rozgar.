name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and Build Signed APK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          rm cmdtools.zip

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2

          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.2" "platform-tools"

          # Create directories
          mkdir -p project/app/src/main/java/com/karachirozgar/app
          mkdir -p project/app/src/main/assets
          mkdir -p project/bin

          # Copy Web Assets
          find . -maxdepth 1 \( -name "*.html" -o -name "*.json" -o -name "*.js" -o -name "*.css" \) -exec cp {} project/app/src/main/assets/ \; || true

          # Create AndroidManifest.xml
          cat << 'EOF' > project/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.karachirozgar.app">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="Karachi Rozgar"
                  android:theme="@android:style/Theme.NoTitleBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity.java
          cat << 'EOF' > project/app/src/main/java/com/karachirozgar/app/MainActivity.java
          package com.karachirozgar.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          cd project

          # 1. Compile Java files
          javac -source 1.8 -target 1.8 -classpath $ANDROID_HOME/platforms/android-33/android.jar app/src/main/java/com/karachirozgar/app/*.java -d bin/

          # 2. Convert to dex
          d8 --output bin/ bin/com/karachirozgar/app/*.class --lib $ANDROID_HOME/platforms/android-33/android.jar

          # 3. Package resources
          aapt package -f -M app/src/main/AndroidManifest.xml -A app/src/main/assets -I $ANDROID_HOME/platforms/android-33/android.jar -F Karachi-Rozgar-unsigned.apk

          # 4. Add classes.dex
          cd bin
          aapt add ../Karachi-Rozgar-unsigned.apk classes.dex
          cd ..

          # 5. Align APK
          zipalign -f 4 Karachi-Rozgar-unsigned.apk Karachi-Rozgar-aligned.apk

          # 6. Generate Debug Keystore and Sign properly using apksigner
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android,O=Android,C=US"
          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android Karachi-Rozgar-aligned.apk Karachi-Rozgar.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karachi-Rozgar-APK
          path: project/Karachi-Rozgar.apk
