name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK via PWABuilder CLI
        run: |
          npm install -g @pwabuilder/pwapush @pwabuilder/cli

          # Create PWABuilder Android package package using CLI manifest generator
          npx @pwabuilder/cli generate --name "Karachi Rozgar" --short-name "Rozgar" --start-url "./index.html" --background-color "#ffffff" --theme-color "#000000" --icon "https://via.placeholder.com/512" --manifest-version 1 --package-id "com.karachirozgar.app" || true

          # If default android project exists, look for it, otherwise build generic wrapper
          find . -name "*.apk" -o -name "app-*.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karachi-Rozgar-APK
          path: |
            *.apk
            **/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.apk
