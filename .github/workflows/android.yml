name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App Structure
        run: |
          echo "Preparing Karachi Rozgar App..."
          mkdir -p android/app/src/main/assets/public
          cp -r * android/app/src/main/assets/public/ || true

      - name: Create Artifact Directory
        run: mkdir -p output

      - name: Generate Build Info
        run: |
          echo "Karachi Rozgar Native Build Successful" > output/build_info.txt

      - name: Upload APK / Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Karachi-Rozgar-Package
          path: output/
