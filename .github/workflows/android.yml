name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK via Bubblewrap CLI
        run: |
          npm i -g @bubblewrap/cli

          # Create a basic manifest configuration for Bubblewrap
          cat << 'EOF' > twa-manifest.json
          {
            "name": "Karachi Rozgar",
            "short_name": "Rozgar",
            "start_url": "./index.html",
            "display": "standalone",
            "theme_color": "#000000",
            "background_color": "#ffffff",
            "manifestUrl": "",
            "iconUrl": "",
            "appId": "com.karachirozgar.app",
            "appVersionName": "1.0",
            "appVersionCode": 1,
            "launcherMonochrome": false,
            "signingKey": {
              "path": "android.keystore",
              "alias": "androiddebugkey"
            },
            "generatorApp": "bubblewrap-cli"
          }
          EOF

          # Build package
          bubblewrap update --manifest=twa-manifest.json || true
          bubblewrap build --manifest=twa-manifest.json || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Karachi-Rozgar-APK
          path: app-release-signed.apk
